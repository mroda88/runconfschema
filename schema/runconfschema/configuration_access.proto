syntax = "proto3";

package dunedaq.runconfschema;

import "runconfschema/common.proto";


// ------------
// Buidling blocks
// -------------

message DropDownContent {
  repeated string values = 1;   // the list of values to be put in the dropdown menu;
}


// ------------
// From backend to frontend
// -------------

// Do we need an initial initialisation request?
message Initialisation {
    string runconf_version = 1;   // the version of the backend;
    string daq_version = 2;   // the version of the DAQ software;
    string apparatus = 3;   // the name of the apparatus;
    map<string,string> structure = 4; // the key the identifier of the dropdown menu, the value is an initial description or string to be put there;
   map<string, DropDownContent> dropdowns = 5;   // the key is the identifier of the dropdown menu,;
   // the size of dropdown menu is not the size of the structue;

   optional string additional_info = 6;   // any additional message to be displayed at the top of the page
   Endpoint backend_endpoint = 7;   // the endpoint of the backend, so that the backend can send messages to it;

   // should we add a version of the messages?
}

// Response to DropDowbSelection
message DropDownUpdate {
    Response response = 1;
    map<string, DropDownContent> update = 2;
    repeated string resets = 3;   // list of identifiers of the dropdown menu to be reset to the initial values;  initial values are in the Intialisation message

}

// Response to Open
message ConfigurationOutcome {
    Response response = 1;
    string oks_file = 2;   
    string current_file = 3;  
    string session_name = 4;  
}

// ------------
// From frontend to backend
//-------------


// this message can be sent automatically by the frontend when dropdown update only has one value
message DropDownSelection {
  string key = 1;   // the identifier of the dropdown menu;
  string value = 2;  // the selected value from the dropdown menu;
}

message Open {
    map<string,string> selection =1; // it might be a bit redundant;
}
    

// sequence
