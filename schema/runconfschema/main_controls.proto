// Protobuf controls for options menu
syntax = "proto3";

package dunedaq.runconfschema;

import "google/protobuf/any.proto";
import "runconfschema/common.proto";

enum AppCommand {
    QUIT = 0; // Quit completely
    CREATE_QUIT = 1; // For now we assume that creating a config = quitting
    RESET = 2; // Reset to initial state
    HELP = 3; // Display the help message
}

// Messages for quit/create/cancel buttons on menus
message MainCommandRequest{
    AppCommand command = 1; // command to send
}

// Backend can return info string from commands (text to display etc.)
message MainCommandResponse {
  Response response = 1; // Response
  AppCommand command = 2; // Command we've sent (for book keeping)
  /*
    Quit: Details is empty
    Create Quit: Path to newly created configuration
    Reset: Full state of the runconf-ui tree as nested LabelledNodes
    Help: Help message?
  */

  optional google.protobuf.Any details = 3; // Info to display

}