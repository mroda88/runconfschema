syntax = "proto3";

package dunedaq.runconfschema;

enum OutcomeFlag {
  SUCCESS = 0;
  FAIL = 1;
  UNKNOWN = 2;
}

message Error {   // Ideally this could evolve into error codes etc, that's why it's ennumerated here, but for now we just have a message;
    string message = 1;
}

message Response {
    OutcomeFlag outcome = 1;
    optional string message = 2;   // any additional message to be displayed to the user
    optional Error error = 3;
}