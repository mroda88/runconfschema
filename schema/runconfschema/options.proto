// Protobuf controls for options menu
syntax = "proto3";

package dunedaq.runconfschema;

import "runconfschema/common.proto";


// Messages for quit/create/cancel buttons on menus
message CreateQuit { 
    Response response = 1;
    bool create = 2;
}

/// Message to close popups (unclear if needed)
message ClosePopup{
    Response response = 1;
}

/// Open menu buttons [might be pure gui side]
message OpenQuit{
    Response response = 1;
}

message OpenCreate {
    Response response = 1;
}
message OpenHelp {
    Response response = 1;
}

/// Send help from the backend
message HelpInfo {
    Response response = 1;
    string help_message = 2;
}

/// Tell runconf-ui to resset
message Reset{
    Response response = 1;
}