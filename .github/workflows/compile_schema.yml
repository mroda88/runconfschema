name: Compile the schema and include in repo

on:
  pull_request:
    branches:
      - develop
      - "prep-release/**"
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "schema/**"
      - "src/**"

permissions:
  contents: write

# Cancel concurrent runs - i.e. if rapid successive pushes are made, cancel the old ones (even if in progress)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Define globals used across multiple jobs
env:
  REPO_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
  HEAD_REF: ${{ github.head_ref || github.ref_name }}


jobs:
  compile-schema:
    name: Validate and update compiled schema
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/dune-daq/nightly-release-alma9:development_v5

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Git for the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compile protobuf schemas into src
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mapfile -d '' schemas < <(find schema -type f -name '*.proto' -print0 | sort -z)
          if (( ${#schemas[@]} == 0 )); then
            echo "::error::No protobuf schemas found under schema/. Configure this step for the repository's schema compiler."
            exit 1
          fi
          bash scripts/generate_protos.py

      - name: Check generated sources
        id: generated
        run: |
          set -euo pipefail
          git add -- src/
          if git diff --cached --quiet -- src/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Compiled schema sources are up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat -- src/
          fi

      - name: Report outdated sources in fork PRs
        if: steps.generated.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Compiled sources are outdated. This workflow cannot push to a fork; regenerate src/ from schema/ and commit the changes to the PR branch."
          exit 1

      - name: Commit generated sources to the source branch
        if: steps.generated.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: regenerate compiled schema sources"
          # A normal push rejects concurrent branch updates rather than overwriting them.
          git push origin "HEAD:refs/heads/${HEAD_REF}"
